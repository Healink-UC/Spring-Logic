# CI/CD Pipeline para el Sistema Integrador de Campañas de Salud Cardiovascular
# Este pipeline implementa TDD y garantiza que solo código probado llegue a producción

name: CI/CD Pipeline

# Triggers del pipeline
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # Job 1: Ejecutar tests y validar código
  test:
    name: Tests & Code Quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache dependencias Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Ejecutar tests unitarios
        run: mvn clean test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Generar reporte de cobertura
        run: mvn jacoco:report

      - name: Verificar build sin tests
        run: mvn -B package -DskipTests

      - name: Subir resultados de tests
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  # Job 2: Auto-merge a main si los tests pasan
  auto-merge:
    name: Auto-merge to main
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Merge develop a main
        run: |
          git checkout main
          git merge develop --no-ff -m "🚀 Auto-merge from develop - Tests passing"
          git push origin main

  # Job 3: Build y Deploy a producción desde main
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build aplicación para producción
        run: mvn -B clean package -DskipTests
        env:
          SPRING_PROFILES_ACTIVE: prod

      - name: Deploy a Render
        uses: JorgeLNJunior/render-deploy@v1.4.3
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          clear_cache: false

      - name: Notificar deploy exitoso
        run: |
          echo "🎉 Deploy completado exitosamente"
          echo "📋 Resumen:"
          echo "- Branch: ${{ github.ref }}"
          echo "- Commit: ${{ github.sha }}"
          echo "- Tests ejecutados: ✅"
          echo "- Deploy: ✅"

  # Job 4: Linting y análisis de código (opcional)
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Análisis estático con SpotBugs
        run: mvn spotbugs:check || true

      - name: Verificar estilo de código
        run: mvn checkstyle:check || true